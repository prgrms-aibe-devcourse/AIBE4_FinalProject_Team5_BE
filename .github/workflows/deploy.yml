name: Deploy to AWS EC2

on:
    push:
        branches: [ "main" ]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  java-version: '17'
                  distribution: 'corretto'

            - name: Build with Gradle
              run: ./gradlew clean build -x test

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker Image
              run: |
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/coditor-api:latest .
                  docker push ${{ secrets.DOCKER_USERNAME }}/coditor-api:latest

            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.AWS_EC2_HOST }}
                  username: ${{ secrets.AWS_EC2_USERNAME }}
                  key: ${{ secrets.AWS_EC2_KEY }}
                  script: |
                      cd /home/ubuntu/coditor

                      git pull origin main

                      echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" > .env
                      echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
                      echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
                      echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
                      echo "RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }}" >> .env
                      echo "RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }}" >> .env
                      echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env

                      docker compose --profile aws pull

                      docker compose --profile aws up -d

                      docker image prune -f
