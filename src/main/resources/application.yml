server:
    port: 8080
    servlet:
        encoding:
            charset: UTF-8
            enabled: true
            force: true

spring:
    application:
        name: coditor

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: update #validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    data:
        redis:
            host: localhost
            port: 6379

    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest

    cloud:
        aws:
            s3:
                bucket: ${S3_BUCKET}
            credentials:
                access-key: ${S3_ACCESS_KEY}
                secret-key: ${S3_SECRET_KEY}
            region:
                static: ${S3_REGION}
